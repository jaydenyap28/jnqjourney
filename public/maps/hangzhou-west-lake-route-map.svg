  <circle cx="32" cy="30" r="17" fill="#4a86b8"/><text x="32" y="37" text-anchor="middle" class="cn" font-size="18" fill="#fff">3</text>
  <text x="58" y="30" class="cn" font-size="20" font-weight="700" fill="#315e80">想换视角</text>
  <text x="22" y="65" class="cn" font-size="21" font-weight="700" fill="#243f48">至少坐一次船</text>
