<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">西湖怎么玩｜JnQ Journey 西湖路线地图</title>
<desc id="desc">西湖经典北线、舒服南线、游船玩法和小众安静线的路线示意图</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f7f3e8"/>
    <stop offset="100%" stop-color="#eef4ec"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d9eef1"/>
    <stop offset="100%" stop-color="#a9d9df"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2b36" flood-opacity=".12"/>
  </filter>
  <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d45445"/></marker>
  <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e7902f"/></marker>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b78bb"/></marker>
  <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7750a8"/></marker>
  <style>
    .cn{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
    .label{font-size:27px;font-weight:700;fill:#173443;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
    .small{font-size:20px;fill:#4a646d}
    .pin{fill:#fff;stroke:#173443;stroke-width:3}
    .route{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>
