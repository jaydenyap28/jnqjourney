  <circle cx="32" cy="30" r="17" fill="#8260aa"/><text x="32" y="37" text-anchor="middle" class="cn" font-size="18" fill="#fff">4</text>
  <text x="58" y="30" class="cn" font-size="20" font-weight="700" fill="#60427d">想避人潮</text>
  <text x="22" y="65" class="cn" font-size="21" font-weight="700" fill="#243f48">去浴鹄湾、乌龟潭</text>
  <text x="22" y="92" class="cn" font-size="16" fill="#6d6177">西湖另一种安静</text>
</g>

