<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Spot 隔离发布候选 · JnQ Journey</title><link rel="stylesheet" href="/candidate.css"><script type="module" src="/candidate-editor.js"></script></head>
<body><main><p>JnQ Journey · Cloudflare 第二阶段</p><h1>Spot 隔离发布测试</h1><p>仅操作指定测试项目与测试 Spot。当前页面用于验证发布架构，尚未替换原有后台。</p>
<form id="login"><label>测试管理员邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>Supabase Auth 登录</button></form>
<section id="editor" hidden><label>测试 Spot<select id="fixture"></select></label><button id="reload" type="button">重新读取</button><form id="save"><label>名称<input name="name" required></label><label>中文名称<input name="name_cn"></label><label>正文<textarea name="description" rows="8"></textarea></label><label>中文体验<textarea name="experience_zh" rows="5"></textarea></label><label>发布状态<select name="publication_status"><option value="">沿用公开状态</option><option value="draft">草稿</option><option value="published">公开</option><option value="hidden">下架</option></select></label><details><summary>完整字段与相册</summary><p>JSON 保留数据类型，适用于隔离兼容验收。</p><textarea id="advanced-fields" rows="14" aria-label="其他 Spot 字段"></textarea></details><label>照片<input id="photo" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"></label><button id="upload" type="button">上传到测试 R2</button><p id="photo-state"></p><img id="image" alt="测试 Spot 照片预览" hidden><button>保存 Spot</button></form><p><a id="public" target="_blank" rel="noopener">打开公开页面</a></p><button id="logout" type="button">退出登录</button></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
